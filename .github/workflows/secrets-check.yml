name: Confirm demo secret configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm DINEDESK_DEMO_KEY is configured
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -n "$DINEDESK_DEMO_KEY" ]; then
            echo "DINEDESK_DEMO_KEY is configured"
          else
            echo "DINEDESK_DEMO_KEY is not configured"
            exit 1
          fi
